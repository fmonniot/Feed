# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Ticket #111: the 8 android.* overrides that used to live here were added
# automatically by the AGP 8->9.0 upgrade assistant to pin the *old* pre-9.0
# behavior (a temporary migration aid) and were never revisited. All 5 that still
# produced deprecation warnings under AGP 9.2.1 (enableAppCompileTimeRClass,
# usesSdkInManifest.disallowed, r8.optimizedResourceShrinking,
# defaults.buildfeatures.resvalues, sdk.defaultTargetSdkToCompileSdkIfUnset) are
# scheduled for removal in AGP 10.0, so pinning them further was never viable
# long-term. Verified safe to drop and accept the new AGP 9.x defaults:
# - No `resValue`/`resValues` usage anywhere in the repo (grepped).
# - `targetSdk` is set explicitly in app/build.gradle.kts, so
#   defaultTargetSdkToCompileSdkIfUnset is moot either way.
# - Release build has `isMinifyEnabled = false`, so R8/resource-shrinking
#   behavior changes (optimizedResourceShrinking, strictFullModeForKeepRules)
#   don't currently apply; app/proguard-rules.pro has no active custom keep
#   rules to interact with stricter R8 full-mode semantics if minification is
#   enabled later.
# - Single AndroidManifest.xml has no `<uses-sdk>` tag to conflict with the
#   Gradle-DSL-only SDK version enforcement.
# - `uniquePackageNames`/`dependency.useConstraints` are efficiency-only,
#   already-superseded AGP 9 flags that produced no warnings; the two modules
#   (`eu.monniot.feed`, `eu.monniot.feed.shared`) already have distinct
#   namespaces so uniqueness already holds without the override.
