name: Docker

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for git describe in scripts/version.sh

      - name: Derive version
        id: version
        run: echo "version=$(./scripts/version.sh)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=ghcr.io/${{ github.repository_owner }}/feed:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=feed-server:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      # Build into the local daemon first (never pushing) so we can run the image before
      # publishing it. A successful `docker build` says nothing about whether the binary
      # inside works — v0.11.6 shipped a placeholder binary that exited 0 immediately.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: FEED_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tag }}

      - name: Smoke test image
        run: ./scripts/docker-smoke-test.sh "${{ steps.image.outputs.tag }}" "${{ steps.version.outputs.version }}"

      # Same inputs as the build above, so this is served from the build cache.
      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: FEED_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          tags: ${{ steps.image.outputs.tag }}
